server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 30MB
spring:
  application:
    name: orientation-backend
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  # Métriques agrégées anonymes : H2 par défaut (dev/tests) ; Postgres en prod via variables d'env.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:metrics;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  cors:
    # Origines autorisées (séparées par des virgules). Surcharge prod via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:5173

admin:
  # Jeton d'accès à l'espace de monitoring. À définir en prod via ADMIN_TOKEN.
  token: ${ADMIN_TOKEN:dev-token}

ocr:
  tessdata-path: ${OCR_TESSDATA_PATH:}
  langue: fra

estimateur:
  sigma: 1.2
  paliers:
    T1:
      bourse: 15.0
    T2:
      bourse: 13.0
      aide: 11.5
    T3:
      bourse: 11.5
      aide: 10.5
    T4:
      bourse: 10.5
      aide: 10.0
  prestige:
    - "Médecine Générale"
    - "Médecine Humaine"
    - "Pharmacie"
    - "Kinésithérapie"
    - "Classes préparatoires MPSI (Mathématiques, Physiques et Science de l'Ingénieur) et PCSI (Physique-Chimie et Science de l'Ingénieur)"
    - "Sciences et Techniques de l'Ingénieur"
    - "Droit"
    - "Droit Privé"
    - "Droit Public"
    - "Sciences Economiques et de Gestion (Tronc commun)"
